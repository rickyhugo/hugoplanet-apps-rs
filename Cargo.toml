[workspace]
members = [
    "apps/*",
    "crates/*",
]
exclude = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "MIT"

[workspace.dependencies]
hp-shelly-blu = { version = "0.1.0", path = "crates/hp-shelly-blu" }
hp-shelly-mqtt = { version = "0.1.0", path = "crates/hp-shelly-mqtt" }

thiserror = "2"
anyhow = "1"
